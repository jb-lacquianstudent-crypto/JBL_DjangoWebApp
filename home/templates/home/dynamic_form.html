<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>
</head>
<body>

    <h1>Student Registration</h1>

    <form method="POST">
        {% csrf_token %}

        <label>Student Name:</label>
        <input type="text" name="student_name" required>

        <br><br>

        <label>Program:</label>
        <input type="text" name="program" required>

        <br><br>

        <button type="submit">Submit</button>
    </form>

</body>
</html>
